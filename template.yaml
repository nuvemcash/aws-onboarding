AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  nuvem.cash - AWS self-service onboarding. Creates the FOCUS 1.2 delivery
  bucket, the organization-wide Data Exports export and the read-only role
  that nuvem.cash assumes with an External ID to read billed costs. Deploy
  this stack in the management account, region us-east-1.

Parameters:
  ExternalId:
    Type: String
    MinLength: 1
    Description: >-
      External ID issued by nuvem.cash for this workspace. Required by the
      role trust policy: without it, sts:AssumeRole fails. It is not a secret
      inside this account (it is stored in clear text in the role trust
      policy, readable by any local IAM reader), which is why it is not
      NoEcho and can be pre-filled by the one-click deploy link.
  NuvemcashPrincipalArn:
    Type: String
    Default: arn:aws:iam::737248776567:root
    Description: ARN of the Nuvem.Online principal allowed to assume the role.
  RoleName:
    Type: String
    Default: nuvemcash-collector
    Description: Deterministic name of the read-only role (its ARN derives from the account ID).
  ExportName:
    Type: String
    Default: nuvemcash-focus-1-2
    Description: Name of the Data Exports export (FOCUS 1.2).
  S3Prefix:
    Type: String
    Default: focus
    AllowedPattern: ^[^/]+(/[^/]+)*$
    ConstraintDescription: must not start or end with "/" and must not contain empty segments (e.g. "focus" or "focus/exports").
    Description: Bucket prefix where the export writes its objects.

Resources:
  FocusBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub nuvemcash-focus-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: nuvemcash:managed-by
          Value: aws-onboarding
        - Key: nuvemcash:purpose
          Value: focus-delivery

  FocusBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FocusBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAWSDataExportsToWriteToS3
            Effect: Allow
            Principal:
              Service: bcm-data-exports.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${FocusBucket.Arn}/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*

  FocusExport:
    Type: AWS::BCMDataExports::Export
    DependsOn: FocusBucketPolicy
    Properties:
      Export:
        Name: !Ref ExportName
        Description: Export FOCUS 1.2 consumido pelo nuvem.cash (leitura via IAM role cross-account).
        DataQuery:
          QueryStatement: >-
            SELECT AvailabilityZone, BilledCost, BillingAccountId,
            BillingAccountName, BillingAccountType, BillingCurrency,
            BillingPeriodEnd, BillingPeriodStart, CapacityReservationId,
            CapacityReservationStatus, ChargeCategory, ChargeClass,
            ChargeDescription, ChargeFrequency, ChargePeriodEnd,
            ChargePeriodStart, CommitmentDiscountCategory,
            CommitmentDiscountId, CommitmentDiscountName,
            CommitmentDiscountQuantity, CommitmentDiscountType,
            CommitmentDiscountStatus, CommitmentDiscountUnit,
            ConsumedQuantity, ConsumedUnit, ContractedCost,
            ContractedUnitPrice, EffectiveCost, InvoiceId,
            InvoiceIssuerName, ListCost, ListUnitPrice, PricingCategory,
            PricingCurrency, PricingCurrencyContractedUnitPrice,
            PricingCurrencyEffectiveCost, PricingCurrencyListUnitPrice,
            PricingQuantity, PricingUnit, ProviderName, PublisherName,
            RegionId, RegionName, ResourceId, ResourceName, ResourceType,
            ServiceCategory, ServiceName, ServiceSubcategory, SkuId,
            SkuPriceDetails, SkuPriceId, SkuMeter, SubAccountId,
            SubAccountName, SubAccountType, Tags, x_Discounts, x_Operation,
            x_ServiceCode FROM FOCUS_1_2_AWS
          TableConfigurations:
            FOCUS_1_2_AWS: {}
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref FocusBucket
            S3Prefix: !Ref S3Prefix
            S3Region: us-east-1
            S3OutputConfigurations:
              OutputType: CUSTOM
              Format: TEXT_OR_CSV
              Compression: GZIP
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS
      Tags:
        - Key: nuvemcash:managed-by
          Value: aws-onboarding

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Leitura do export FOCUS pelo nuvem.cash (assume-role + External ID).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref NuvemcashPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: nuvemcash-collector-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadFocusObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${FocusBucket.Arn}/${S3Prefix}/*
              - Sid: ListFocusBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt FocusBucket.Arn
              - Sid: ReadCostExplorer
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                Resource: "*"
      Tags:
        - Key: nuvemcash:managed-by
          Value: aws-onboarding

Outputs:
  RoleArn:
    Description: ARN of the read-only role, used to set up the provider in nuvem.cash.
    Value: !GetAtt CollectorRole.Arn
  BucketName:
    Description: Bucket where the FOCUS export writes its objects.
    Value: !Ref FocusBucket
  ExportArn:
    Description: ARN of the Data Exports export (FOCUS 1.2).
    Value: !GetAtt FocusExport.ExportArn
  AppPrefix:
    Description: Full prefix (S3Prefix/ExportName) where nuvem.cash reads the objects.
    Value: !Sub ${S3Prefix}/${ExportName}
