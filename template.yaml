AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  nuvem.cash — onboarding self-service AWS. Cria o bucket de entrega do FOCUS
  1.2, o export Data Exports da organização inteira e a role read-only que o
  nuvem.cash assume via External ID para ler o faturado. Aplique este stack
  na management account, região us-east-1.

Parameters:
  ExternalId:
    Type: String
    MinLength: 1
    Description: >-
      External ID emitido pelo nuvem.cash para este workspace. Exigido no
      trust da role — sem ele, sts:AssumeRole falha. Não é segredo dentro
      desta conta: fica em texto claro na trust policy da própria role,
      visível a qualquer leitor de IAM local — por isso não é NoEcho, o que
      permite o preenchimento automático pelo link de deploy em um clique.
  NuvemcashPrincipalArn:
    Type: String
    Default: arn:aws:iam::737248776567:root
    Description: ARN do principal da Nuvem.Online autorizado a assumir a role.
  RoleName:
    Type: String
    Default: nuvemcash-collector
    Description: Nome determinístico da role read-only (ARN derivável do account ID).
  ExportName:
    Type: String
    Default: nuvemcash-focus-1-2
    Description: Nome do export Data Exports (FOCUS 1.2).
  S3Prefix:
    Type: String
    Default: focus
    Description: Prefixo no bucket onde o export escreve os objetos.

Resources:
  FocusBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nuvemcash-focus-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: nuvemcash:managed-by
          Value: aws-onboarding
        - Key: nuvemcash:purpose
          Value: focus-delivery

  FocusBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FocusBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAWSDataExportsToWriteToS3
            Effect: Allow
            Principal:
              Service: bcm-data-exports.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${FocusBucket.Arn}/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*

  FocusExport:
    Type: AWS::BCMDataExports::Export
    DependsOn: FocusBucketPolicy
    Properties:
      Export:
        Name: !Ref ExportName
        Description: Export FOCUS 1.2 consumido pelo nuvem.cash (leitura via IAM role cross-account).
        DataQuery:
          QueryStatement: >-
            SELECT AvailabilityZone, BilledCost, BillingAccountId,
            BillingAccountName, BillingAccountType, BillingCurrency,
            BillingPeriodEnd, BillingPeriodStart, CapacityReservationId,
            CapacityReservationStatus, ChargeCategory, ChargeClass,
            ChargeDescription, ChargeFrequency, ChargePeriodEnd,
            ChargePeriodStart, CommitmentDiscountCategory,
            CommitmentDiscountId, CommitmentDiscountName,
            CommitmentDiscountQuantity, CommitmentDiscountType,
            CommitmentDiscountStatus, CommitmentDiscountUnit,
            ConsumedQuantity, ConsumedUnit, ContractedCost,
            ContractedUnitPrice, EffectiveCost, InvoiceId,
            InvoiceIssuerName, ListCost, ListUnitPrice, PricingCategory,
            PricingCurrency, PricingCurrencyContractedUnitPrice,
            PricingCurrencyEffectiveCost, PricingCurrencyListUnitPrice,
            PricingQuantity, PricingUnit, ProviderName, PublisherName,
            RegionId, RegionName, ResourceId, ResourceName, ResourceType,
            ServiceCategory, ServiceName, ServiceSubcategory, SkuId,
            SkuPriceDetails, SkuPriceId, SkuMeter, SubAccountId,
            SubAccountName, SubAccountType, Tags, x_Discounts, x_Operation,
            x_ServiceCode FROM FOCUS_1_2_AWS
          TableConfigurations:
            FOCUS_1_2_AWS: {}
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref FocusBucket
            S3Prefix: !Ref S3Prefix
            S3Region: us-east-1
            S3OutputConfigurations:
              OutputType: CUSTOM
              Format: TEXT_OR_CSV
              Compression: GZIP
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS
      Tags:
        - Key: nuvemcash:managed-by
          Value: aws-onboarding

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Leitura do export FOCUS pelo nuvem.cash (assume-role + External ID).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref NuvemcashPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: nuvemcash-collector-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadFocusObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${FocusBucket.Arn}/*
              - Sid: ListFocusBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt FocusBucket.Arn
              - Sid: ReadCostExplorer
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                Resource: "*"
              - Sid: ReadExportMetadata
                Effect: Allow
                Action:
                  - bcm-data-exports:GetExport
                  - bcm-data-exports:ListExports
                  - bcm-data-exports:GetTable
                  - bcm-data-exports:ListTables
                  - bcm-data-exports:ListExecutions
                Resource: "*"
      Tags:
        - Key: nuvemcash:managed-by
          Value: aws-onboarding

Outputs:
  RoleArn:
    Description: ARN da role read-only para configurar o provider no nuvem.cash.
    Value: !GetAtt CollectorRole.Arn
  BucketName:
    Description: Bucket onde o export FOCUS escreve os objetos.
    Value: !Ref FocusBucket
  ExportArn:
    Description: ARN do export Data Exports (FOCUS 1.2).
    Value: !GetAtt FocusExport.ExportArn
  AppPrefix:
    Description: Prefixo completo (S3Prefix/ExportName) onde o nuvem.cash lê os objetos.
    Value: !Sub ${S3Prefix}/${ExportName}
